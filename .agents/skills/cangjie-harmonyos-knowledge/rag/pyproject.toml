[project]
name = "cjdocs"
version = "0.1.0"
description = "Offline-first Cangjie HarmonyOS documentation knowledge service with optional AI enhancements."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "cjdocs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cjdocs = "cjdocs.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

